name: CI

on:
  push:
    branches:
      - main
      - agent/clipping-factory-buildout
      - "agent/**"
      - "redesign/**"
  pull_request:
    branches:
      - main
      - agent/clipping-factory-buildout

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test · eval fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --locked

      - name: Eval runner syntax
        run: bash -n evals/run.sh

      - name: Eval report syntax
        run: python3 -m py_compile evals/report.py evals/replay_opening_gate.py

      - name: Eval fixture tests
        run: python3 -m unittest discover -s evals/tests -v

  promo:
    name: promo typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promo-videos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: promo-videos/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
